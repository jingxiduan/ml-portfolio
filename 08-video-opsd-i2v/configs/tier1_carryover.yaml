# Tier 1 (zero video training) config
# Compute budget on M3 Pro (as measured 2026-10-28, DynamiCrafter smoke test):
#   ~234s/clip at 25 DDIM steps. 100 prompts × 2 seeds × 2 methods = 400 clips ≈ 26h total.
# Paired Wilcoxon on 100 prompts × 2 seeds gives enough power to detect Δ > 0.015 at α=0.05.

seeds: [0, 1]
limit: 100                        # 100 prompts out of 1118 (balanced sample)

prompts_json: "data/vbench_i2v_prompts/eval_split.json"

# ---------------------- T2I ----------------------
frame_height: 320
frame_width: 512
t2i_steps: 28
t2i_cfg: 4.5
t2i_dtype: "fp16"
cpu_offload: false                # set true on < 24 GB

frames_dir:
  base: "outputs/tier1/frames_base"
  opsd: "outputs/tier1/frames_opsd"

# ---------------------- I2V ----------------------
num_frames: 16
fps: 8
ddim_steps: 25                    # down from 50; smoke test confirmed quality OK

videos_dir:
  base: "outputs/tier1/videos_base"
  opsd: "outputs/tier1/videos_opsd"

# ---------------------- VBench ----------------------
vbench_dims:
  - subject_consistency
  - background_consistency
  - motion_smoothness
  - dynamic_degree
  - aesthetic_quality
  - imaging_quality
  - i2v_subject
  - i2v_background
  - camera_motion

vbench_dir:
  base: "outputs/tier1/vbench_base"
  opsd: "outputs/tier1/vbench_opsd"

# ---------------------- Qwen2-VL judge ----------------------
judge_n_pairs: 100
judge_json: "outputs/tier1/judge.json"

# ---------------------- final outputs ----------------------
out_dir: "outputs/tier1"

# ---------------------- controls ----------------------
force_t2i: false
force_i2v: false
force_vbench: false
force_judge: false
