# Tier-2 natural OPSD-I2V config — anti-reward-hacking LoRA training.
# See docs/tier2/METHOD.md for rationale.
# Changes vs opsd_i2v_default.yaml:
#   - aesthetic reward REMOVED (the root cause of saturation hacking)
#   - naturalness_penalty reward ADDED
#   - motion_smoothness weight: 0.5 -> 1.0
#   - dynamic_degree weight: 1.0 -> 0.8
#   - lr: 5e-5 -> 2e-5
#   - num_steps: 500 -> 50
#   - warmup: 20 -> 10
#   - ckpt_path: dynamicrafter_512 (H20 download)

model:
  ckpt_path: "weights/dynamicrafter_512/model.ckpt"
  resolution: [320, 512]
  num_frames: 16
  fps: 8
  guidance_scale: 7.5
  num_inference_steps: 50
  lora_rank: 16
  lora_alpha: 32
  dtype_override: null

train:
  first_frame_dir: "data/first_frames"
  train_prompts: "data/prompts/tier2_train.json"
  batch_size: 1
  num_workers: 0

  num_steps: 50
  lr: 2.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_steps: 10

  c_adv: 5.0
  sigma_q_min: 0.2
  sigma_q_max: 0.8
  inner_fit_steps: 1
  reward_grad_rescale: "l2"

  ema_decay: 0.995
  ema_refresh_every: 25
  ema_warmup_steps: 50

  log_every: 5
  ckpt_every: 10
  out_dir: "outputs/opsd_tier2_h20"
  seed: 0
  wandb_project: null
  wandb_run_name: null

reward:
  components:
    subject_consistency:
      weight: 1.0
      model_name: "ViT-B-32"
      pretrained: "openai"
    motion_smoothness:
      weight: 1.0
    dynamic_degree:
      weight: 0.8
      cap_tau: 0.6
    naturalness_penalty:
      weight: 0.5
