# Long training NoNat: 2000 steps, no naturalness penalty.
# Paired with long_v2.yaml — only difference is no naturalness_penalty.
# lr and c_adv will be set based on T1 probe results.

model:
  ckpt_path: "weights/dynamicrafter_512/model.ckpt"
  resolution: [320, 512]
  num_frames: 16
  fps: 8
  guidance_scale: 7.5
  num_inference_steps: 50
  lora_rank: 16
  lora_alpha: 32
  dtype_override: null

train:
  first_frame_dir: "data/first_frames_200"
  train_prompts: "data/prompts/tier2_train_200.json"
  batch_size: 1
  num_workers: 0

  num_steps: 2000
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_steps: 50

  c_adv: 40.0
  sigma_q_min: 0.2
  sigma_q_max: 0.8
  inner_fit_steps: 1
  reward_grad_rescale: "l2"

  ema_decay: 0.999
  ema_refresh_every: 25
  ema_warmup_steps: 100

  log_every: 5
  ckpt_every: 50
  out_dir: "outputs/opsd_long_no_nat"
  seed: 0
  wandb_project: null
  wandb_run_name: null

reward:
  components:
    subject_consistency:
      weight: 1.0
      model_name: "ViT-B-32"
      pretrained: "openai"
    motion_smoothness:
      weight: 1.0
    dynamic_degree:
      weight: 1.0
      cap_tau: 0.6
