<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blind Video Preference Study</title>
  <style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e8ecf6}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px}.card{background:#151c30;border:1px solid #293350;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0006}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.muted{color:#9ea9c2}.videos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.pane{background:#090d18;border-radius:14px;padding:12px;text-align:center}.label{font-size:22px;font-weight:800;margin:2px 0 10px}video{width:100%;max-height:520px;background:#000;border-radius:10px}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}button{border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;background:#26314d;color:#fff}button.primary{background:#506cff}input{background:#090d18;color:#fff;border:1px solid #34405f;border-radius:9px;padding:10px}.progress{height:9px;background:#252e45;border-radius:9px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#50d0a0}.done{display:none;text-align:center;padding:35px}@media(max-width:760px){.videos{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style>
</head>
<body><main class="wrap"><section class="card" id="study"><div class="head"><div><h1>Blind Video Preference Study</h1><p class="muted">Model identities and A/B assignment are hidden. Watch both clips before choosing.</p></div><label>Participant ID <input id="pid" placeholder="anonymous code"></label></div><div class="progress"><div class="bar" id="bar"></div></div><div id="count" class="muted"></div><h2 id="prompt"></h2><div class="videos"><div class="pane"><div class="label">A</div><video id="a" controls loop playsinline></video></div><div class="pane"><div class="label">B</div><video id="b" controls loop playsinline></video></div></div><div class="buttons"><button onclick="vote('A')">Prefer A</button><button onclick="vote('TIE')">Tie / indistinguishable</button><button onclick="vote('B')">Prefer B</button></div></section><section class="card done" id="done"><h1>Study complete</h1><p>Download the CSV and send it to the organizer. It contains no model identities.</p><button class="primary" onclick="downloadCSV()">Download responses.csv</button></section></main>
<script>let data,index=0,responses=[];async function init(){data=await fetch('study.json').then(r=>r.json());show()}function show(){const t=data.trials[index];document.getElementById('count').textContent=`Trial ${index+1} of ${data.trials.length} · Project ${t.project}`;document.getElementById('bar').style.width=`${100*index/data.trials.length}%`;document.getElementById('prompt').textContent=t.prompt;for(const[id,key]of[['a','video_a'],['b','video_b']]){const v=document.getElementById(id);v.pause();v.src=t[key];v.load()}}function vote(choice){const pid=document.getElementById('pid').value.trim();if(!pid){alert('Enter an anonymous participant ID first.');return}responses.push({participant_id:pid,trial_id:data.trials[index].trial_id,choice});index++;if(index===data.trials.length){document.getElementById('study').style.display='none';document.getElementById('done').style.display='block'}else show()}function downloadCSV(){const lines=['participant_id,trial_id,choice',...responses.map(x=>`${x.participant_id},${x.trial_id},${x.choice}`)];const blob=new Blob([lines.join('\n')+'\n'],{type:'text/csv'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='responses.csv';a.click();URL.revokeObjectURL(url)}init();</script></body></html>
